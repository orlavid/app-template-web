name: Release

# Runs when a maintainer pushes a version tag (for example v1.2.3).
# Produces: a tarball of dist/, a CycloneDX SBOM, SLSA build level 3
# provenance (.intoto.jsonl), GitHub artifact attestations, and a container
# image on ghcr.io with BuildKit provenance and SBOM attestations.

on:
  push:
    tags: ["v*"]

permissions: read-all

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CYCLONEDX_NPM_VERSION: 6.0.1
  IMAGE_NAME: ghcr.io/orlavid/app-template-web

jobs:
  build:
    name: Build tarball and SBOM
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # actions/attest-build-provenance signs with Sigstore
      attestations: write
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Audit
        run: npm audit --audit-level=low
      - name: Build
        run: npm run build
      - name: Package dist/ (reproducible tarball)
        env:
          TAG: ${{ github.ref_name }}
        run: |
          epoch="$(git log -1 --format=%ct)"
          tar --sort=name --mtime="@${epoch}" --owner=0 --group=0 --numeric-owner \
            -cf - -C dist . | gzip -n -9 > "app-template-web-${TAG}.tar.gz"
      - name: Generate CycloneDX SBOM
        env:
          TAG: ${{ github.ref_name }}
        run: |
          npx --yes "@cyclonedx/cyclonedx-npm@${CYCLONEDX_NPM_VERSION}" \
            --omit dev --output-format JSON \
            --output-file "app-template-web-${TAG}.cdx.json"
      - name: Compute provenance subjects
        id: hash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          hashes="$(sha256sum "app-template-web-${TAG}.tar.gz" "app-template-web-${TAG}.cdx.json" | base64 -w0)"
          echo "hashes=${hashes}" >> "$GITHUB_OUTPUT"
      - name: Attest build provenance (GitHub attestations)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            app-template-web-*.tar.gz
            app-template-web-*.cdx.json
      - name: Upload release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: |
            app-template-web-*.tar.gz
            app-template-web-*.cdx.json
          if-no-files-found: error
          retention-days: 5

  release:
    name: Create GitHub Release
    needs: [build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
      - name: Create release with tarball and SBOM
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "${TAG}" \
            "app-template-web-${TAG}.tar.gz" \
            "app-template-web-${TAG}.cdx.json" \
            --verify-tag --title "${TAG}" --generate-notes

  provenance:
    name: SLSA provenance
    needs: [build, release]
    permissions:
      actions: read # read the workflow path
      id-token: write # sign the provenance
      contents: write # attach the .intoto.jsonl to the release
    # The SLSA generator must be referenced by tag, not by SHA:
    # its builder verifies its own ref. Scorecard exempts this reference.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.build.outputs.hashes }}
      upload-assets: true

  image:
    name: Container image
    needs: [build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to ghcr.io
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
      - name: Attest image provenance (GitHub attestations)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
