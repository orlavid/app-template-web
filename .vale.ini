# Vale configuration: ASD-STE100-style Simplified Technical English checks.
# The rules in .vale/styles/STE/ are a project implementation. They do not
# reproduce the ASD-STE100 dictionary. See docs/glossary.md for project terms.
StylesPath = .vale/styles
MinAlertLevel = suggestion
Vocab = Project

# Vale skips fenced code blocks and inline code in Markdown by default.
# The TokenIgnores entry below also skips bare URLs.
[*.md]
BasedOnStyles = STE
Vale.Terms = YES
Vale.Repetition = YES
TokenIgnores = (https?://\S+)
